# lodo release server: download page + update files from R2.
# Deploy: cd worker && npx wrangler@4 deploy
name = "lodo"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [{ pattern = "lodo.kreasimaju.id", custom_domain = true }]

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "lodo-releases"
